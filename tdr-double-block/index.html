<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TdR 双阻断细胞周期同步模拟器</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:#1d1d1f;background:#f5f5f7}*{box-sizing:border-box}body{margin:0}.app{max-width:1380px;margin:auto;padding:28px}.hero{text-align:center;padding:24px 0 28px}.hero small{font-weight:800;color:#6e6e73}.hero h1{font-size:clamp(36px,5vw,64px);margin:8px 0 12px}.hero p{color:#6e6e73;font-size:17px}.panel,.timeline,.diagram,.card{background:#fff;border:1px solid #dbe5f0;border-radius:22px;box-shadow:0 14px 38px #0000000d}.panel{padding:20px}.sliders{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.ctrl label{display:flex;justify-content:space-between;font-size:14px;font-weight:700}.ctrl input{width:100%;margin-top:10px}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px;padding-top:16px;border-top:1px solid #eee}.speed{margin-left:auto;display:flex;gap:6px;align-items:center}.speed button.active{background:#0071e3;color:#fff}.actions button{border:1px solid #d2d2d7;border-radius:999px;background:#fff;padding:10px 15px;font-weight:700;cursor:pointer}.actions .primary{background:#0071e3;color:#fff;border-color:#0071e3}.timeline{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:12px;margin:18px 0}.timeline div{background:#f5f5f7;border-radius:16px;padding:11px;min-height:62px}.timeline .active{outline:2px solid #0071e3;background:#fff}.timeline b,.timeline span{display:block}.timeline span{color:#6e6e73;font-size:12px;margin-top:4px}.workspace{display:grid;grid-template-columns:minmax(520px,1fr) 360px;gap:18px}.diagram{display:grid;place-items:center;padding:20px;min-height:650px}.diagram svg{width:min(100%,620px);height:auto}.legend{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;color:#6e6e73;font-size:13px}.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px}.side{display:grid;gap:14px}.card{padding:20px}.card h2{margin:0 0 8px}.card p{color:#6e6e73;line-height:1.55}.track,.bar{height:9px;border-radius:99px;background:#e8e8ed;overflow:hidden}.track>div,.bar>div{height:100%;background:#0071e3}.stat{padding:13px 0;border-top:1px solid #eee}.statline{display:flex;justify-content:space-between;gap:12px}.stat small{color:#6e6e73}.verify{padding:14px;border-radius:16px;background:#effaf3;color:#1d6f42;font-weight:800}.phase{font-size:14px;font-weight:900;paint-order:stroke;stroke:#fff;stroke-width:4}.boundary{font-size:12px;font-weight:800;fill:#666;paint-order:stroke;stroke:#fff;stroke-width:4}.cell{filter:drop-shadow(0 2px 2px #0004)}@media(max-width:900px){.workspace{grid-template-columns:1fr}.sliders{grid-template-columns:1fr}.timeline{grid-template-columns:1fr 1fr}.speed{margin-left:0}}@media(max-width:600px){.app{padding:14px}.timeline{grid-template-columns:1fr}}</style></head><body><main class="app"><header class="hero"><small>TdR DOUBLE BLOCK</small><h1>TdR 双阻断细胞周期同步模拟器</h1><p>细胞按 23.0 h 细胞周期匀速、连续运动。G1 10.5 h · S 6.4 h · G2 4.2 h · M 1.9 h。</p></header><section class="panel"><div class="sliders"><div class="ctrl"><label>第一次 TdR 阻断 <b id="b1v">16.6 h</b></label><input id="b1" type="range" min="0" max="30" step="0.1" value="16.6"></div><div class="ctrl"><label>洗脱释放 <b id="wv">6.4 h</b></label><input id="w" type="range" min="0" max="20" step="0.1" value="6.4"></div><div class="ctrl"><label>第二次 TdR 阻断 <b id="b2v">16.6 h</b></label><input id="b2" type="range" min="0" max="30" step="0.1" value="16.6"></div></div><div class="actions"><button class="primary" id="play">▶ 开始模拟</button><button id="step">单步播放</button><button id="reset">重置</button><button id="verify">快速验证默认理论结果</button><div class="speed"><span>速度</span><button data-s="0.5">0.5×</button><button class="active" data-s="1">1×</button><button data-s="2">2×</button></div></div></section><section class="timeline" id="timeline"></section><section class="workspace"><section class="diagram"><div><svg id="svg" viewBox="0 0 500 500"></svg><div class="legend"><span><i style="background:#1f2937"></i>运动中</span><span><i style="background:#f59e0b"></i>S 期原位停滞</span><span><i style="background:#dc2626"></i>G1/S 聚集</span></div></div></section><aside class="side"><section class="card"><small style="color:#0071e3;font-weight:800">当前阶段</small><h2 id="stageTitle"></h2><p id="stageDesc"></p><div class="track"><div id="stageProg"></div></div><small id="elapsed"></small></section><section class="card"><small style="color:#0071e3;font-weight:800">统计面板</small><div id="stats"></div></section><div id="verifyBox"></div></aside></section></main><script>const PERIOD=23,G1=10.5,S=6.4,G2=4.2,M=1.9,BLOCK=G1,SG2=G1+S,G2M=G1+S+G2,N=120,EPS=.002;let settings={b1:16.6,w:6.4,b2:16.6},elapsed=0,running=false,speed=1,last=null,raf=null;const phases=[['G1',0,G1,'#bfdbfe','#1d4ed8'],['S',G1,SG2,'#fed7aa','#c2410c'],['G2',SG2,G2M,'#bbf7d0','#15803d'],['M',G2M,PERIOD,'#e9d5ff','#7e22ce']];const wrap=x=>(x%PERIOD+PERIOD)%PERIOD;const inS=x=>{x=wrap(x);return x>BLOCK+EPS&&x<SG2-EPS};const atBlock=x=>Math.abs(wrap(x)-BLOCK)<=EPS;const distToBlock=x=>{x=wrap(x);return atBlock(x)?0:x<BLOCK?BLOCK-x:PERIOD-x+BLOCK};function cells0(){return Array.from({length:N},(_,i)=>({p:i*PERIOD/N,state:'moving'}))}function block(c,t){return c.map(o=>{let p=wrap(o.p);if(atBlock(p))return{p:BLOCK,state:'blocked'};if(inS(p))return{p,state:'stalled'};let d=distToBlock(p);return t+EPS>=d?{p:BLOCK,state:'blocked'}:{p:wrap(p+t),state:'moving'}})}function wash(c,t){return c.map(o=>({...o,p:wrap(o.p+t),state:'moving'}))}function snapshot(){let total=settings.b1+settings.w+settings.b2,e=Math.max(0,Math.min(elapsed,total)),c=cells0(),stage='initial',start=0,dur=0;if(e===0){stage='initial'}else if(e<=settings.b1){c=block(c,e);stage='b1';dur=settings.b1}else if(e<=settings.b1+settings.w){c=block(c,settings.b1);c=wash(c,e-settings.b1);stage='w';start=settings.b1;dur=settings.w}else{c=block(c,settings.b1);c=wash(c,settings.w);c=block(c,e-settings.b1-settings.w);stage=e>=total?'final':'b2';start=settings.b1+settings.w;dur=settings.b2}return{c,e,total,stage,progress:dur?Math.max(0,Math.min(1,(e-start)/dur)):stage==='final'?1:0}}const stageInfo={initial:['初始均匀分布','120 个细胞沿 23 h 细胞周期圆环均匀分布。'],b1:['第一次 TdR 阻断','TdR 存在时，S 期细胞原位停滞；其他细胞匀速前进并在 G1/S 阻断点聚集。'],w:['洗脱释放','移除 TdR 后，所有细胞解除阻断，并以相同速度连续前进。'],b2:['第二次 TdR 阻断','再次加入 TdR，细胞按相同规则被阻断并逐步同步。'],final:['最终同步结果','检查细胞是否最终聚集于 G1/S 阻断点。']};function polar(r,deg){let a=(deg-90)*Math.PI/180;return[250+r*Math.cos(a),250+r*Math.sin(a)]}function arc(r1,r2,a0,a1){let [x1,y1]=polar(r2,a0),[x2,y2]=polar(r2,a1),[x3,y3]=polar(r1,a1),[x4,y4]=polar(r1,a0),large=(a1-a0)>180?1:0;return`M${x1} ${y1}A${r2} ${r2} 0 ${large} 1 ${x2} ${y2}L${x3} ${y3}A${r1} ${r1} 0 ${large} 0 ${x4} ${y4}Z`}function renderStatic(){let s=document.getElementById('svg');let h='';for(let q of phases){let a0=q[1]/PERIOD*360,a1=q[2]/PERIOD*360;h+=`<path d="${arc(145,205,a0,a1)}" fill="${q[3]}" opacity=".92"/>`;let [tx,ty]=polar(176,(a0+a1)/2);h+=`<text x="${tx}" y="${ty+5}" text-anchor="middle" class="phase" fill="${q[4]}">${q[0]}</text>`}for(let [name,p,red] of [['M/G1',0,0],['G1/S',BLOCK,1],['S/G2',SG2,0],['G2/M',G2M,0]]){let d=p/PERIOD*360,[x1,y1]=polar(140,d),[x2,y2]=polar(212,d),[tx,ty]=polar(230,d),[cx,cy]=polar(176,d);h+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${red?'#b91c1c':'#86868b'}" stroke-width="${red?3:2}" stroke-dasharray="${red?'7 6':'5 6'}"/>`;h+=`<circle cx="${cx}" cy="${cy}" r="${red?10:5}" fill="${red?'#dc2626':'#86868b'}" stroke="#fff" stroke-width="3"/>`;h+=`<text x="${tx}" y="${ty+4}" text-anchor="middle" class="boundary" fill="${red?'#991b1b':'#666'}">${name}</text>`}h+=`<circle cx="250" cy="250" r="145" fill="#fff" stroke="#d6e0ec" stroke-width="2"/><text x="250" y="240" text-anchor="middle" font-size="34" font-weight="900">23.0 h</text><text x="250" y="270" text-anchor="middle" fill="#6e6e73" font-weight="700">G1 / S / G2 / M</text><g id="cells"></g>`;s.innerHTML=h}function timeline(){let x=[['initial','初始均匀分布',0],['b1','第一次 TdR 阻断',settings.b1],['w','洗脱释放',settings.w],['b2','第二次 TdR 阻断',settings.b2],['final','最终同步结果',0]],st=snapshot().stage;document.getElementById('timeline').innerHTML=x.map(v=>`<div class="${v[0]===st?'active':''}"><b>${v[1]}</b><span>${v[2]?v[2].toFixed(1)+' h':v[0]==='initial'?'起点':'完成'}</span></div>`).join('')}function render(){let z=snapshot(),g=document.getElementById('cells');g.innerHTML=z.c.map(o=>{let [x,y]=polar(176,o.p/PERIOD*360),fill=o.state==='blocked'?'#dc2626':o.state==='stalled'?'#f59e0b':'#1f2937',r=o.state==='blocked'?5.2:4.1;return`<circle class="cell" cx="${x.toFixed(2)}" cy="${y.toFixed(2)}" r="${r}" fill="${fill}"/>`}).join('');let info=stageInfo[z.stage];document.getElementById('stageTitle').textContent=info[0];document.getElementById('stageDesc').textContent=info[1];document.getElementById('stageProg').style.width=(z.progress*100)+'%';document.getElementById('elapsed').textContent=`已模拟 ${z.e.toFixed(1)} h / ${z.total.toFixed(1)} h`;let ss=z.c.filter(o=>inS(o.p)&&o.state==='stalled').length,bb=z.c.filter(o=>o.state==='blocked').length,mm=z.c.filter(o=>o.state==='moving').length;document.getElementById('stats').innerHTML=[['位于 S 期',ss],['位于 G1/S 阻断点',bb],['仍在运动中',mm]].map(v=>{let p=v[1]/N*100;return`<div class="stat"><div class="statline"><div><b>${v[0]}</b><br><small>${v[1]} / ${N} 个细胞</small></div><b>${p.toFixed(1)}%</b></div><div class="bar"><div style="width:${p}%"></div></div></div>`}).join('');document.getElementById('verifyBox').innerHTML=bb===N?'<div class="verify">理论验证通过：所有细胞最终聚集于 G1/S 阻断点。</div>':'';timeline()}function animate(t){if(!running)return;if(last==null)last=t;let dt=t-last;last=t;elapsed+=dt*.004*speed;let total=settings.b1+settings.w+settings.b2;if(elapsed>=total){elapsed=total;running=false;document.getElementById('play').textContent='▶ 重新播放';last=null}render();if(running)raf=requestAnimationFrame(animate)}function reset(){running=false;cancelAnimationFrame(raf);elapsed=0;last=null;document.getElementById('play').textContent='▶ 开始模拟';document.getElementById('verifyBox').innerHTML='';render()}['b1','w','b2'].forEach(id=>{let el=document.getElementById(id);el.oninput=()=>{settings[id]=+el.value;document.getElementById(id+'v').textContent=(+el.value).toFixed(1)+' h';reset()}});document.getElementById('play').onclick=()=>{let total=settings.b1+settings.w+settings.b2;if(elapsed>=total)elapsed=0;running=!running;document.getElementById('play').textContent=running?'⏸ 暂停':'▶ 继续';last=null;if(running)raf=requestAnimationFrame(animate)};document.getElementById('reset').onclick=reset;document.getElementById('step').onclick=()=>{running=false;cancelAnimationFrame(raf);let a=[settings.b1,settings.b1+settings.w,settings.b1+settings.w+settings.b2],n=a.find(x=>elapsed<x-.001);elapsed=n??a[2];render()};document.getElementById('verify').onclick=()=>{settings={b1:16.6,w:6.4,b2:16.6};['b1','w','b2'].forEach(id=>{document.getElementById(id).value=settings[id];document.getElementById(id+'v').textContent=settings[id].toFixed(1)+' h'});elapsed=39.6;running=false;render()};document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{speed=+b.dataset.s;document.querySelectorAll('[data-s]').forEach(x=>x.classList.toggle('active',x===b))});renderStatic();render();</script></body></html>
